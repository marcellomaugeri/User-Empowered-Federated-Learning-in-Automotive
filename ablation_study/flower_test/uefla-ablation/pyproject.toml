[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uefla-ablation"
version = "1.0.0"
description = ""
license = "Apache-2.0"
dependencies = [
    "flwr[simulation]>=1.9.0,<2.0",
    "flwr-datasets[vision]>=0.0.2,<1.0.0",
    "tensorflow>=2.11.1",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "marcellomaugeri"

[tool.flwr.app.components]
serverapp = "uefla_ablation.server_app:app"
clientapp = "uefla_ablation.client_app:app"

[tool.flwr.app.config]
num-server-rounds = 3
local-epochs = 10
batch-size = 16
verbose = true

[tool.flwr.federations]
default = "local-simulation"

[tool.flwr.federations.local-simulation]
options.num-supernodes = 10
